<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TradeLog Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, query, where }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadString, getDownloadURL, deleteObject }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  // ══════════════════════════════════════════
  //  🔥 FIREBASE CONFIG
  //  Remplace par ta propre config Firebase
  // ══════════════════════════════════════════
  const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyByw-Tm8-L5Y5J5SaxepsimuAQldfjUuTA",
    authDomain:        "trade-log-pro-4498e.firebaseapp.com",
    projectId:         "trade-log-pro-4498e",
    storageBucket:     "trade-log-pro-4498e.firebasestorage.app",
    messagingSenderId: "633243281135",
    appId:             "1:633243281135:web:f16eec02373f89aeeddd1a"
  };

  const DEMO_MODE = FIREBASE_CONFIG.apiKey === "AIzaSyByw-Tm8-L5Y5J5SaxepsimuAQldfjUuTA";

  let app, auth, db, storage, currentUser = null;

  if (!DEMO_MODE) {
    app     = initializeApp(FIREBASE_CONFIG);
    auth    = getAuth(app);
    db      = getFirestore(app);
    storage = getStorage(app);

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        document.getElementById('fb-login-screen').style.display = 'none';
        document.getElementById('app-root').style.display        = 'block';
        window._fbUid = user.uid;
        window._fbSyncReady = true;
        window.dispatchEvent(new Event('fb-ready'));
      } else {
        document.getElementById('fb-login-screen').style.display = 'flex';
        document.getElementById('app-root').style.display        = 'none';
      }
    });
  } else {
    // Demo mode — localStorage only
    document.getElementById('fb-login-screen').style.display = 'none';
    document.getElementById('app-root').style.display        = 'block';
    window._fbSyncReady = false;
  }

  // ── Expose Firebase helpers to global scope ──
  window._fb = {
    signIn: async () => {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    },
    signOut: async () => {
      await signOut(auth);
    },
    save: async (col, id, data) => {
      if (!window._fbSyncReady) return;
      await setDoc(doc(db, `users/${window._fbUid}/${col}`, id), data);
    },
    load: async (col, id) => {
      if (!window._fbSyncReady) return null;
      const snap = await getDoc(doc(db, `users/${window._fbUid}/${col}`, id));
      return snap.exists() ? snap.data() : null;
    },
    loadAll: async (col) => {
      if (!window._fbSyncReady) return [];
      const snap = await getDocs(collection(db, `users/${window._fbUid}/${col}`));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    del: async (col, id) => {
      if (!window._fbSyncReady) return;
      await deleteDoc(doc(db, `users/${window._fbUid}/${col}`, id));
    },
    uploadImage: async (path, base64) => {
      if (!window._fbSyncReady) return null;
      const r = ref(storage, path);
      await uploadString(r, base64, 'data_url');
      return await getDownloadURL(r);
    },
    deleteImage: async (path) => {
      if (!window._fbSyncReady) return;
      try { await deleteObject(ref(storage, path)); } catch(_) {}
    },
  };
</script>

<style>
/* ══════════════════════════════════════════
   ROOT VARIABLES
══════════════════════════════════════════ */
:root {
  --bg:#07090c; --surf:#0f1217; --surf2:#161b22; --surf3:#1c2230;
  --bdr:#1e2530; --bdr2:#2a3340;
  --gold:#FFD700; --goldl:#FFC83D; --golddim:rgba(255,215,0,.12);
  --grn:#00E5A0; --grndim:rgba(0,229,160,.1);
  --red:#FF4D6D; --reddim:rgba(255,77,109,.1);
  --blu:#4D9FFF; --bludim:rgba(77,159,255,.1);
  --txt:#DDE3ED; --txt2:#6B7A8D; --muted:#4A5568;
  --r:10px; --r-sm:6px; --r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;
  min-height:100vh;overflow-x:hidden;overscroll-behavior:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,215,0,.018)1px,transparent 1px),
  linear-gradient(90deg,rgba(255,215,0,.018)1px,transparent 1px);
  background-size:44px 44px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:99px}

/* ══════════════════════════════════════════
   FIREBASE LOGIN SCREEN
══════════════════════════════════════════ */
#fb-login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;text-align:center;position:fixed;inset:0;
  background:var(--bg);z-index:9999
}
.fb-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;
  letter-spacing:-.03em;margin-bottom:8px}
.fb-logo span{color:var(--gold)}
.fb-subtitle{color:var(--txt2);font-size:.85rem;margin-bottom:40px}
.fb-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);
  padding:28px;max-width:340px;width:100%;margin-bottom:16px}
.fb-card p{font-size:.82rem;color:var(--txt2);margin-bottom:20px;line-height:1.6}
.btn-google{display:flex;align-items:center;gap:10px;justify-content:center;
  background:#fff;color:#333;border:none;border-radius:8px;padding:12px 24px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;
  width:100%;transition:all .2s}
.btn-google:hover{background:#f0f0f0}
.btn-google svg{width:20px;height:20px;flex-shrink:0}
.fb-note{font-size:.72rem;color:var(--muted);max-width:320px}
.demo-link{color:var(--gold);cursor:pointer;text-decoration:underline;
  font-size:.78rem;margin-top:12px;display:block}

/* ══════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════ */
#app-root{position:relative;z-index:1;display:none}

/* ══════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════ */
.app{max-width:960px;margin:0 auto;padding:0 0 72px}

/* ── TOP HEADER ── */
.top-header{
  position:sticky;top:0;z-index:50;background:rgba(7,9,12,.95);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between
}
.logo{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;
  letter-spacing:-.03em}
.logo span{color:var(--gold)}
.header-right{display:flex;gap:8px;align-items:center}

/* ── ACCOUNT TABS ── */
.acct-scroll{overflow-x:auto;padding:10px 16px 0;display:flex;gap:6px;
  scrollbar-width:none}
.acct-scroll::-webkit-scrollbar{display:none}
.acct-chip{flex-shrink:0;padding:6px 14px;border-radius:99px;
  border:1px solid var(--bdr);background:var(--surf2);
  font-family:'Syne',sans-serif;font-weight:700;font-size:.75rem;
  color:var(--txt2);cursor:pointer;transition:all .2s;white-space:nowrap}
.acct-chip.active{background:var(--golddim);border-color:rgba(255,215,0,.5);color:var(--gold)}
.acct-chip.add-btn{border-style:dashed;color:var(--muted)}
.acct-chip.add-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(15,18,23,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--bdr);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
  max-width:960px;margin:0 auto
}
.nav-item{display:flex;flex-direction:column;align-items:center;
  gap:3px;flex:1;padding:4px 2px;cursor:pointer;transition:all .2s;
  border:none;background:none}
.nav-item .nav-icon{font-size:1.2rem}
.nav-item .nav-label{font-family:'Syne',sans-serif;font-size:.6rem;
  font-weight:700;letter-spacing:.05em;color:var(--muted);transition:color .2s}
.nav-item.active .nav-label{color:var(--gold)}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px var(--gold))}

/* ── PAGES ── */
.page{display:none;padding:14px 16px;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══════════════════════════════════════════
   CARDS & COMPONENTS
══════════════════════════════════════════ */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:16px}
.card2{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r)}
.card-title{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.section-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;
  margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* ── STATS GRID ── */
.stat-grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:1fr 1fr 1fr 1fr}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
.stat-card{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);
  padding:12px 14px}
.stat-label{font-size:.58rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.stat-val{font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:700}
.stat-sub{font-family:'Space Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:2px}
.pos{color:var(--grn)}.neg{color:var(--red)}.neu{color:var(--goldl)}.blu{color:var(--blu)}

/* ── FORM ELEMENTS ── */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.62rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
input,select,textarea{
  background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r-sm);
  color:var(--txt);font-family:'Space Mono',monospace;font-size:.82rem;
  padding:9px 11px;outline:none;transition:border-color .2s;width:100%;
  -webkit-appearance:none
}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:72px;font-family:'Inter',sans-serif;font-size:.82rem}
select option{background:var(--surf2)}
input[type=range]{padding:0;height:4px;border-radius:99px;
  background:var(--bdr);accent-color:var(--goldl)}
input[type=checkbox]{width:auto;accent-color:var(--gold)}

/* ── BUTTONS ── */
.btn{background:var(--gold);color:#000;border:none;border-radius:var(--r-sm);
  padding:10px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:.84rem;
  cursor:pointer;transition:all .2s;letter-spacing:.03em;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.full{width:100%;justify-content:center}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:6px 12px;font-size:.74rem}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.icon-btn{background:none;border:1px solid var(--bdr);border-radius:var(--r-sm);
  color:var(--muted);padding:5px 9px;cursor:pointer;font-size:.72rem;transition:all .2s}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.icon-btn.del:hover{border-color:var(--red);color:var(--red)}

/* ── PROGRESS BAR ── */
.prog-wrap{background:var(--surf3);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .4s}
.h4{height:4px}.h6{height:6px}.h8{height:8px}

/* ── BANNERS ── */
.banner{border-radius:var(--r);padding:11px 14px;
  font-family:'Syne',sans-serif;font-weight:700;font-size:.8rem;
  display:none;margin-bottom:12px;align-items:center;gap:10px}
.banner.show{display:flex}
.banner.stop{background:var(--reddim);border:1px solid rgba(255,77,109,.4);color:var(--red);
  animation:pulse 1.5s infinite}
.banner.warn{background:rgba(255,200,61,.08);border:1px solid rgba(255,200,61,.3);color:var(--goldl)}
.banner.info{background:var(--golddim);border:1px solid rgba(255,215,0,.3);color:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;
  padding:3px 10px;font-size:.68rem;font-weight:700;font-family:'Syne',sans-serif}
.badge.grn{background:var(--grndim);color:var(--grn);border:1px solid rgba(0,229,160,.3)}
.badge.red{background:var(--reddim);color:var(--red);border:1px solid rgba(255,77,109,.3)}
.badge.yel{background:rgba(255,200,61,.1);color:var(--goldl);border:1px solid rgba(255,200,61,.3)}
.badge.blu{background:var(--bludim);color:var(--blu);border:1px solid rgba(77,159,255,.3)}
.day-badge{background:rgba(255,200,61,.1);color:var(--goldl);
  border:1px solid rgba(255,200,61,.3);border-radius:99px;
  padding:3px 10px;font-family:'Space Mono',monospace;font-size:.7rem;font-weight:700}

/* ── EMOTION CHIPS ── */
.emo-wrap{display:flex;flex-wrap:wrap;gap:6px}
.emo-chip{padding:6px 12px;border-radius:99px;border:1px solid var(--bdr);
  background:var(--surf2);font-size:.78rem;font-weight:600;color:var(--txt2);
  cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
.emo-chip.sel{border-color:rgba(255,200,61,.6);background:rgba(255,200,61,.1);
  color:var(--goldl)}

/* ── CHECK TOGGLE ── */
.chk-item{display:flex;align-items:center;justify-content:space-between;
  padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--bdr);
  background:var(--surf2);margin-bottom:7px;gap:10px;transition:all .2s}
.chk-item.ok{border-color:rgba(0,229,160,.35);background:rgba(0,229,160,.05)}
.chk-item.nok{border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.05)}
.chk-label{flex:1}
.chk-label b{display:block;font-size:.84rem;font-weight:700;color:var(--txt)}
.chk-label small{font-size:.7rem;color:var(--muted)}
.toggle-pair{display:flex;gap:5px}
.tog{padding:5px 13px;border-radius:99px;border:1px solid var(--bdr);
  background:var(--surf3);font-size:.73rem;font-weight:700;cursor:pointer;
  transition:all .15s;font-family:'Syne',sans-serif}
.tog.ok-sel{background:rgba(0,229,160,.2);border-color:rgba(0,229,160,.6);color:var(--grn)}
.tog.nok-sel{background:rgba(255,77,109,.2);border-color:rgba(255,77,109,.6);color:var(--red)}

/* ── VERDICT BOX ── */
.verdict{border-radius:var(--r);padding:18px;text-align:center;
  border:2px solid;margin:14px 0}
.verdict.go{background:var(--grndim);border-color:rgba(0,229,160,.5)}
.verdict.nogo{background:var(--reddim);border-color:rgba(255,77,109,.5);animation:pulse 2s infinite}
.verdict.pending{background:rgba(255,200,61,.07);border-color:rgba(255,200,61,.3)}
.verdict-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;
  letter-spacing:.04em}
.verdict-sub{font-size:.78rem;margin-top:5px;opacity:.75}

/* ── TRADE ITEM ── */
.trade-item{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);
  padding:12px 13px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
  transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.trade-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.trade-item.win::before{background:var(--grn)}
.trade-item.loss::before{background:var(--red)}
.trade-item.be::before{background:var(--goldl)}
.trade-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.62rem;font-weight:700;flex-shrink:0}
.trade-num.win{background:rgba(0,229,160,.15);color:var(--grn)}
.trade-num.loss{background:rgba(255,77,109,.15);color:var(--red)}
.trade-num.be{background:rgba(255,200,61,.15);color:var(--goldl)}
.trade-info{flex:1;min-width:0}
.trade-pair{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem}
.trade-meta{font-family:'Space Mono',monospace;font-size:.65rem;color:var(--muted);
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade-note-p{font-size:.7rem;color:var(--muted);font-style:italic;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.trade-amount{font-family:'Space Mono',monospace;font-weight:700;font-size:.9rem;
  white-space:nowrap;flex-shrink:0}
.trade-amount.win{color:var(--grn)}.trade-amount.loss{color:var(--red)}
.trade-amount.be{color:var(--goldl)}
.trade-actions{display:flex;gap:4px;flex-shrink:0}

/* ── SCREENSHOT ── */
.ss-box{border:2px dashed var(--bdr);border-radius:var(--r);
  min-height:90px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;cursor:pointer;transition:all .2s;
  background:var(--surf2);position:relative;overflow:hidden}
.ss-box:hover{border-color:var(--gold);background:var(--golddim)}
.ss-box img{width:100%;max-height:220px;object-fit:contain;border-radius:var(--r-sm)}
.ss-box-label{font-size:.75rem;color:var(--muted);font-family:'Inter',sans-serif}
.ss-icon{font-size:1.6rem}
.ss-remove{position:absolute;top:6px;right:6px;background:rgba(255,77,109,.8);
  border:none;border-radius:99px;color:#fff;padding:2px 8px;font-size:.7rem;
  cursor:pointer;z-index:10}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{text-align:center;font-size:.55rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);padding:5px 0}
.cal-day{min-height:56px;border-radius:7px;border:1px solid var(--bdr);
  background:var(--surf2);padding:4px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;gap:1px}
.cal-day:hover{border-color:var(--gold);background:var(--golddim)}
.cal-day.today-d{border-color:var(--goldl);box-shadow:0 0 0 1px var(--goldl)}
.cal-day.other-m{opacity:.22;pointer-events:none}
.cal-day.win-d{background:rgba(0,229,160,.07)!important;border-color:rgba(0,229,160,.3)!important}
.cal-day.loss-d{background:rgba(255,77,109,.07)!important;border-color:rgba(255,77,109,.3)!important}
.cal-day.be-d{background:rgba(255,200,61,.06)!important;border-color:rgba(255,200,61,.25)!important}
.cal-day-n{font-family:'Space Mono',monospace;font-size:.58rem;color:var(--muted)}
.cal-emo{font-size:.75rem}
.cal-pnl{font-family:'Space Mono',monospace;font-size:.5rem;font-weight:700}
.cal-pnl.pos{color:var(--grn)}.cal-pnl.neg{color:var(--red)}

/* ── EQUITY CHART ── */
.eq-canvas-wrap{width:100%;height:140px;margin-top:8px}

/* ── MINI BAR ── */
.mini-bars{display:flex;align-items:flex-end;gap:3px;height:54px}
.mini-bar{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.mini-bar.pos{background:var(--grn)}.mini-bar.neg{background:var(--red)}
.mini-bar.z{background:var(--bdr);height:3px}
.mini-bar-labels{display:flex;gap:3px;margin-top:3px}
.mini-bar-label{flex:1;text-align:center;font-family:'Space Mono',monospace;
  font-size:.52rem;color:var(--muted)}

/* ── OBJECTIVE ── */
.obj-card{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);
  padding:14px;margin-bottom:8px}
.obj-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.obj-title{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700}
.obj-pct{font-family:'Space Mono',monospace;font-size:.82rem;font-weight:700}

/* ── SUMMARY TABLE ── */
.sum-table{width:100%;border-collapse:collapse}
.sum-table th{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:7px 8px;text-align:left;border-bottom:1px solid var(--bdr)}
.sum-table td{padding:8px 8px;border-bottom:1px solid var(--bdr);
  font-family:'Space Mono',monospace;font-size:.72rem}
.sum-table tr:last-child td{border-bottom:none}
.sum-table tr:hover td{background:rgba(255,255,255,.015)}

/* ── DD METER ── */
.dd-meter{border-radius:var(--r);padding:12px 14px;border:1px solid var(--bdr)}
.dd-meter.safe{background:rgba(0,229,160,.04);border-color:rgba(0,229,160,.2)}
.dd-meter.warn{background:rgba(255,200,61,.06);border-color:rgba(255,200,61,.3)}
.dd-meter.danger{background:var(--reddim);border-color:rgba(255,77,109,.4);animation:pulse 1.5s infinite}

/* ── MODAL ── */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
  z-index:200;align-items:flex-end;justify-content:center;padding:0}
.modal-ov.open{display:flex}
.modal{background:var(--surf);border:1px solid var(--bdr2);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:20px 20px max(20px,env(safe-area-inset-bottom));
  width:100%;max-width:960px;max-height:92vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--bdr2);border-radius:99px;
  margin:0 auto 16px}
.modal-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:800;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── GATE OVERLAY ── */
#gate-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:100;align-items:center;justify-content:center;padding:16px
}
#gate-overlay.open{display:flex}
.gate-box{background:var(--surf);border:1px solid var(--bdr2);
  border-radius:var(--r-lg);padding:22px;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto}

/* ── UTILS ── */
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-gap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sep{border:none;border-top:1px solid var(--bdr);margin:14px 0}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:.82rem}
.empty-icon{font-size:2rem;margin-bottom:8px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);
  display:inline-block;animation:pulse 2s infinite}
.sync-dot.off{background:var(--muted);animation:none}

/* ── SEARCH / FILTER ── */
.search-bar{position:relative}
.search-bar input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:.9rem;pointer-events:none}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:5px 12px;border-radius:99px;
  border:1px solid var(--bdr);background:var(--surf2);
  font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;
  transition:all .15s;font-family:'Syne',sans-serif;white-space:nowrap}
.filter-chip.active{background:var(--golddim);border-color:rgba(255,215,0,.5);color:var(--gold)}

/* ── HEATMAP ── */
.heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hm-cell{aspect-ratio:1;border-radius:4px;cursor:pointer;transition:all .15s}
.hm-cell:hover{transform:scale(1.15)}

/* ── JOURNAL ENTRY ── */
.journal-entry{background:var(--surf2);border:1px solid var(--bdr);
  border-radius:var(--r);padding:14px;margin-bottom:10px}
.journal-date{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted);
  margin-bottom:8px}
.journal-disc{display:flex;align-items:center;gap:8px;margin-top:8px}
.disc-stars{display:flex;gap:3px}
.disc-star{font-size:1rem;cursor:pointer;transition:transform .1s}
.disc-star:hover{transform:scale(1.2)}
</style>
</head>
<body>

<script>
'use strict';
// ══════════════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════════════
const CRITERIA = [
  {id:'concentration',label:'Concentration',  emoji:'🎯',desc:'Niveau de focus et d\'attention'},
  {id:'discipline',   label:'Discipline',      emoji:'⚖️',desc:'Respect du plan de trading'},
  {id:'confiance',    label:'Confiance',        emoji:'💪',desc:'Confiance en soi et en l\'analyse'},
  {id:'patience',     label:'Patience',         emoji:'⏳',desc:'Capacité à attendre le bon setup'},
  {id:'sante',        label:'Forme physique',   emoji:'🏃',desc:'Énergie corporelle'},
  {id:'sommeil',      label:'Sommeil',          emoji:'😴',desc:'Qualité et durée du sommeil'},
  {id:'stress',       label:'Gestion du stress',emoji:'🧘',desc:'Contrôle émotionnel'},
];
const ENTRY_CONDITIONS = [
  {id:'tv_analysis',  label:'Analyse TradingView faite',      emoji:'📈'},
  {id:'setup_ok',     label:'Setup confirmé (OB/FVG/BOS…)',   emoji:'✅'},
  {id:'session_ok',   label:'Session de trading active',       emoji:'🕐'},
  {id:'no_news',      label:'Pas de news importantes (30min)', emoji:'📰'},
  {id:'sl_tp_set',    label:'SL et TP définis',               emoji:'🎯'},
  {id:'risk_ok',      label:'Risque calculé et accepté',      emoji:'💰'},
];
const EMOTIONS = ['🧊 Froid','😌 Serein','🎯 Focus','😤 Frustré',
  '😰 Stressé','🚀 Euphorique','😴 Fatigué','😡 Vengeur'];
const PAIRS    = ['XAUUSD','EURUSD','GBPUSD','USDJPY','GBPJPY',
  'NAS100','US30','BTCUSD','Autre'];
const SESSIONS = ['Asie','Londres','New York','Pré-marché'];
const SETUPS   = ['Order Block','FVG','Break & Retest','Breakout',
  'Support/Résistance','ICT Kill Zone','Autre'];
const CHECK_THRESHOLD = 5;
const ENTRY_THRESHOLD = 6; // all entry conditions must be checked

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let state = {
  accounts:[],
  trades:{},        // accountId → [trade,…]
  dailies:{},       // accountId → { date → DailyEntry }
  objectives:{},    // accountId → [obj,…]
  settings:{ currency:'$', startDates:{} },
};
let activeAcctId = '';
let gateEditId   = null; // trade being edited after gate
let calOffset = 0, weekOffset = 0, monthOffset = 0;
let histFilters = { search:'', result:'all', dir:'all', pair:'all' };

// ══════════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════════
const toKey = d => d instanceof Date ? d.toISOString().split('T')[0] : d;
const today = () => toKey(new Date());
const uid   = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt   = (n,c='$') => (n>=0?'+':'')+n.toFixed(2)+' '+c;
const fmtA  = (n,c='$') => n.toFixed(2)+' '+c;
const cc    = v => v>0?'pos':v<0?'neg':'neu';
const cl    = (v,a,b) => Math.max(a,Math.min(b,v));
const acct  = () => state.accounts.find(a=>a.id===activeAcctId)||state.accounts[0];
const myTrades = (aid=activeAcctId) => state.trades[aid]||[];
const dayTrades= (d,aid=activeAcctId) => myTrades(aid).filter(t=>t.date===d);
const dayNumber= (aid=activeAcctId) => {
  const sd = state.settings.startDates[aid];
  if(!sd) return null;
  try{ const s=new Date(sd+'T00:00:00'), n=new Date();
    n.setHours(0,0,0,0); return Math.floor((n-s)/86400000)+1; }
  catch{ return null; }
};

// ══════════════════════════════════════════════════════════════
//  STORAGE — localStorage + Firebase sync
// ══════════════════════════════════════════════════════════════
function saveLocal(){ localStorage.setItem('tlog_pro4', JSON.stringify(state)); }
function loadLocal(){
  const raw=localStorage.getItem('tlog_pro4');
  if(raw){ try{ state=JSON.parse(raw); ensureStructure(); }catch(e){} }
}
function ensureStructure(){
  if(!state.accounts)  state.accounts=[];
  if(!state.trades)    state.trades={};
  if(!state.dailies)   state.dailies={};
  if(!state.objectives)state.objectives={};
  if(!state.settings)  state.settings={currency:'$',startDates:{}};
  if(!state.settings.startDates) state.settings.startDates={};
}

async function saveAll(){
  saveLocal();
  if(!window._fbSyncReady) return;
  try{
    await window._fb.save('state','main',JSON.parse(JSON.stringify(state)));
    document.getElementById('sync-dot').classList.remove('off');
  }catch(e){ document.getElementById('sync-dot').classList.add('off'); }
}
async function loadFromFirebase(){
  if(!window._fbSyncReady) return;
  try{
    const remote = await window._fb.load('state','main');
    if(remote){ state=remote; ensureStructure(); saveLocal(); }
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
async function init(){
  loadLocal();
  if(window._fbSyncReady) await loadFromFirebase();
  else if(window._fbSyncReady===false){
    // demo mode
    document.getElementById('sync-dot').classList.add('off');
  }
  if(state.accounts.length===0) seedDefaultAccounts();
  if(state.accounts.length>0) activeAcctId=state.accounts[0].id;
  seedDefaultObjectives();
  renderApp();
  checkDailyGate();
}

window.addEventListener('fb-ready', async ()=>{
  await loadFromFirebase();
  document.getElementById('logout-btn').style.display='block';
  renderApp();
  checkDailyGate();
});

function startDemo(){
  document.getElementById('fb-login-screen').style.display='none';
  document.getElementById('app-root').style.display='block';
  init();
}
window.addEventListener('DOMContentLoaded', ()=>{
  if(document.getElementById('app-root').style.display==='block') init();
});
// If already shown (demo config key already set)
if(document.getElementById('app-root') &&
   document.getElementById('app-root').style.display==='block') init();

function doLogout(){ window._fb?.signOut(); }

// ══════════════════════════════════════════════════════════════
//  DEFAULT DATA
// ══════════════════════════════════════════════════════════════
function seedDefaultAccounts(){
  const t=today();
  state.accounts=[
    {id:'pf_5ers',   name:'5ers PropFirm',      capital:2500, riskCapital:125,
     riskPerTrade:6,  ddDaily:125, ddGlobal:250,  currency:'$',
     maxTrades:3, maxLosses:2, setupAPlus:false, propFirm:'5ers'},
    {id:'cent_exness',name:'Exness Cent',        capital:200,  riskCapital:200,
     riskPerTrade:20, ddDaily:200, ddGlobal:200,  currency:'USC',
     maxTrades:3, maxLosses:2, setupAPlus:true,  propFirm:'Exness'},
    {id:'instant_1k', name:'Instant Funding 1K', capital:1000, riskCapital:100,
     riskPerTrade:10, ddDaily:50,  ddGlobal:100,  currency:'$',
     maxTrades:3, maxLosses:2, setupAPlus:false, propFirm:'Instant Funding'},
  ];
  state.accounts.forEach(a=>{
    state.settings.startDates[a.id]=t;
    if(!state.trades[a.id])   state.trades[a.id]=[];
    if(!state.dailies[a.id])  state.dailies[a.id]={};
    if(!state.objectives[a.id]) state.objectives[a.id]=[];
  });
  activeAcctId='pf_5ers';
}

function seedDefaultObjectives(){
  state.accounts.forEach(a=>{
    if(!state.objectives[a.id]) state.objectives[a.id]=[];
    if(state.objectives[a.id].length>0) return;
    state.objectives[a.id]=[
      {id:uid(),type:'pnl_daily',   title:'Objectif journalier',
       desc:`Réaliser ${a.riskPerTrade*3} ${a.currency} aujourd'hui`,
       target:a.riskPerTrade*3, period:'daily',   achieved:false},
      {id:uid(),type:'no_loss',     title:'Max 2 SL par jour',
       desc:'Ne pas dépasser 2 stop-loss dans la journée',
       target:2,                 period:'daily',   achieved:false},
      {id:uid(),type:'winrate',     title:'Win Rate ≥ 60%',
       desc:'Maintenir un win rate de 60% ou plus',
       target:60,                period:'alltime', achieved:false},
      {id:uid(),type:'pnl_monthly', title:'Objectif mensuel',
       desc:`Réaliser ${a.riskPerTrade*20} ${a.currency} ce mois`,
       target:a.riskPerTrade*20, period:'monthly', achieved:false},
      {id:uid(),type:'discipline',  title:'Plan respecté (semaine)',
       desc:'Respecter le plan de trading cette semaine',
       target:5,                 period:'weekly',  achieved:false},
      {id:uid(),type:'funded',      title:'Passer le challenge',
       desc:'Atteindre l\'objectif de profit du compte',
       target:a.ddGlobal*0.8,   period:'alltime', achieved:false},
    ];
  });
}

// ══════════════════════════════════════════════════════════════
//  DAILY GATE — Checklist obligatoire une fois par jour
// ══════════════════════════════════════════════════════════════
function checkDailyGate(){
  const a=acct(); if(!a) return;
  const d=today();
  const entry=(state.dailies[a.id]||{})[d];
  // Gate already passed today
  if(entry && entry.gatePassed) return;
  openGate();
}

function openGate(){
  const a=acct(); if(!a) return;
  const d=today();
  const existing=(state.dailies[a.id]||{})[d]||{};
  const checks   = existing.criteria||{};
  const conditions = existing.conditions||{};
  const emotion  = existing.mainEmotion||'';

  document.getElementById('gate-content').innerHTML = buildGateHTML(checks,conditions,emotion,a,d);
  document.getElementById('gate-overlay').classList.add('open');
  refreshGateVerdict();
}

function buildGateHTML(checks,conditions,emotion,a,d){
  const dn = dayNumber(a.id);
  return `
    <div class="flex-between mb12">
      <div>
        <div style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:800">
          🧠 Checklist du jour
        </div>
        <div style="font-size:.72rem;color:var(--muted);margin-top:2px">${d}
          ${dn?`<span class="day-badge" style="margin-left:8px">Jour ${dn}</span>`:''}
        </div>
      </div>
      <button class="btn ghost sm" onclick="skipGate()">Ignorer</button>
    </div>

    <!-- Compte actif -->
    <div class="banner info show mb12" style="font-size:.76rem">
      🏢 ${a.name} — Risque: ${a.riskPerTrade} ${a.currency}/trade · DD: ${a.ddDaily} ${a.currency}
    </div>

    <!-- Humeur -->
    <div class="card-title">😶 Humeur principale</div>
    <div class="emo-wrap mb12" id="gate-emos">
      ${EMOTIONS.map(e=>`
        <span class="emo-chip ${emotion===e?'sel':''}" onclick="gateSetEmo(this,'${e}')">${e}</span>
      `).join('')}
    </div>

    <!-- 7 Critères -->
    <div class="flex-between mb8">
      <div class="card-title" style="margin:0">🧠 7 Critères</div>
      <span id="gate-crit-score" style="font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700"></span>
    </div>
    ${CRITERIA.map(c=>`
      <div class="chk-item ${checks[c.id]===true?'ok':checks[c.id]===false?'nok':''}" id="gate-ci-${c.id}">
        <div class="chk-label">
          <b>${c.emoji} ${c.label}</b>
          <small>${c.desc}</small>
        </div>
        <div class="toggle-pair">
          <span class="tog ${checks[c.id]===true?'ok-sel':''}" onclick="gateSetCrit('${c.id}',true)">✅</span>
          <span class="tog ${checks[c.id]===false?'nok-sel':''}" onclick="gateSetCrit('${c.id}',false)">❌</span>
        </div>
      </div>
    `).join('')}

    <div class="sep"></div>

    <!-- Conditions d'entrée -->
    <div class="card-title mb8">📊 Conditions d'entrée</div>
    ${ENTRY_CONDITIONS.map(c=>`
      <div class="chk-item ${conditions[c.id]?'ok':''}" id="gate-ec-${c.id}">
        <div class="chk-label">
          <b>${c.emoji} ${c.label}</b>
        </div>
        <div class="toggle-pair">
          <span class="tog ${conditions[c.id]?'ok-sel':''}"
            onclick="gateSetCond('${c.id}',!${!!conditions[c.id]})">
            ${conditions[c.id]?'✅':'☐'}
          </span>
        </div>
      </div>
    `).join('')}

    <!-- Verdict -->
    <div id="gate-verdict" class="verdict pending mt12">
      <div class="verdict-title">⏳ Complète la checklist</div>
      <div class="verdict-sub">Réponds à tous les critères</div>
    </div>

    <!-- Validate -->

// Gate state (temp, not saved until validate)
let _gateChecks={}, _gateConds={}, _gateEmo='';

function gateSetEmo(el,val){
  _gateEmo=val;
  document.querySelectorAll('#gate-emos .emo-chip').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}
function gateSetCrit(id,val){
  _gateChecks[id]=val;
  const item=document.getElementById('gate-ci-'+id);
  item.classList.remove('ok','nok');
  item.classList.add(val?'ok':'nok');
  item.querySelectorAll('.tog').forEach(t=>t.classList.remove('ok-sel','nok-sel'));
  item.querySelectorAll('.tog')[val?0:1].classList.add(val?'ok-sel':'nok-sel');
  refreshGateVerdict();
}
function gateSetCond(id,val){
  _gateConds[id]=val;
  const item=document.getElementById('gate-ec-'+id);
  item.classList.toggle('ok',val);
  const tog=item.querySelector('.tog');
  tog.classList.toggle('ok-sel',val);
  tog.textContent=val?'✅':'☐';
  refreshGateVerdict();
}

function refreshGateVerdict(){
  const okCount=Object.values(_gateChecks).filter(v=>v===true).length;
  const answered=Object.keys(_gateChecks).length;
  const allDone=answered>=CRITERIA.length;
  const condOk=ENTRY_CONDITIONS.every(c=>_gateConds[c.id]);
  const canTrade=allDone && okCount>=CHECK_THRESHOLD && condOk;

  const scoreEl=document.getElementById('gate-crit-score');
  if(scoreEl) scoreEl.textContent=`${okCount}/${CRITERIA.length}`;
  scoreEl && (scoreEl.style.color=okCount>=CHECK_THRESHOLD?'var(--grn)':'var(--red)');

  const vd=document.getElementById('gate-verdict');
  const vbtn=document.getElementById('gate-validate-btn');
  if(!vd||!vbtn) return;

  if(!allDone){
    vd.className='verdict pending mt12';
    vd.innerHTML=`<div class="verdict-title">⏳ ${answered}/${CRITERIA.length} critères</div>
      <div class="verdict-sub">Réponds à tous pour le verdict</div>`;
    vbtn.disabled=true;
  } else if(!condOk){
    vd.className='verdict pending mt12';
    const missingCond=ENTRY_CONDITIONS.filter(c=>!_gateConds[c.id]).length;
    vd.innerHTML=`<div class="verdict-title">📊 ${missingCond} condition(s) manquante(s)</div>
      <div class="verdict-sub">Coche toutes les conditions d'entrée</div>`;
    vbtn.disabled=canTrade?false:true;
  } else if(canTrade){
    vd.className='verdict go mt12';
    vd.innerHTML=`<div class="verdict-title" style="color:var(--grn)">✅ VOUS POUVEZ TRADER</div>
      <div class="verdict-sub" style="color:var(--grn)">${okCount}/7 OK · Toutes conditions ✅ · Bonne session !</div>`;
    vbtn.disabled=false;
  } else {
    vd.className='verdict nogo mt12';
    vd.innerHTML=`<div class="verdict-title" style="color:var(--red)">⛔ NE PAS TRADER AUJOURD'HUI</div>
      <div class="verdict-sub" style="color:var(--red)">${okCount}/7 OK — Minimum ${CHECK_THRESHOLD}/7 requis</div>`;
    vbtn.disabled=false; // still let them save but UI is red
  }
}

async function validateGate(){
  const a=acct(); if(!a) return;
  const d=today();
  const okCount=Object.values(_gateChecks).filter(v=>v===true).length;
  const answered=Object.keys(_gateChecks).length;
  const condOk=ENTRY_CONDITIONS.every(c=>_gateConds[c.id]);
  const canTrade=answered>=CRITERIA.length && okCount>=CHECK_THRESHOLD && condOk;
  if(!state.dailies[a.id]) state.dailies[a.id]={};
  state.dailies[a.id][d]={
    ...(state.dailies[a.id][d]||{}),
    mainEmotion:_gateEmo, criteria:{..._gateChecks},
    conditions:{..._gateConds}, canTrade, gatePassed:true,
    discipline:(state.dailies[a.id][d]||{}).discipline||5,
    note:(state.dailies[a.id][d]||{}).note||'',
    mistakes:(state.dailies[a.id][d]||{}).mistakes||'',
    lessons:(state.dailies[a.id][d]||{}).lessons||'',
  };
  await saveAll();
  document.getElementById('gate-overlay').classList.remove('open');
  _gateChecks={}; _gateConds={}; _gateEmo='';
  renderApp();
}

  document.getElementById('gate-overlay').classList.remove('open');

//  STATISTICS ENGINE
// ══════════════════════════════════════════════════════════════
function getStats(aid=activeAcctId){
  const a=state.accounts.find(x=>x.id===aid)||acct();
  const trades=myTrades(aid);
  if(!trades.length) return emptyStats(a);
  const wins  =trades.filter(t=>t.result==='win');
  const losses=trades.filter(t=>t.result==='loss');
  const tGain =wins.reduce((s,t)=>s+t.amount,0);
  const tLoss =losses.reduce((s,t)=>s+Math.abs(t.amount),0);
  const net   =trades.reduce((s,t)=>s+t.amount,0);
  const wr    =wins.length/trades.length*100;
  const pf    =tLoss>0?tGain/tLoss:Infinity;
  const avgRR =trades.reduce((s,t)=>s+t.rr,0)/trades.length;
  const ev    =net/trades.length;
  const sorted=[...trades].sort((a,b)=>b.amount-a.amount);
  // Streaks
  let curS=0,curST='',maxW=0,maxL=0,ws=0,ls=0;
  for(let i=trades.length-1;i>=0;i--){
    const r=trades[i].result; if(r==='be') continue;
    if(!curST){curST=r;curS=1;} else if(r===curST) curS++; else break;
  }
  trades.forEach(t=>{
    if(t.result==='win'){ws++;ls=0;if(ws>maxW)maxW=ws;}
    else if(t.result==='loss'){ls++;ws=0;if(ls>maxL)maxL=ls;}
  });
  // Equity
  const st=[...trades].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  let cum=0; const eq=[0]; st.forEach(t=>{cum+=t.amount;eq.push(cum);});
  // PNL periods
  const now=new Date(), todayStr=today();
  const mFilter=t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();};
  const wStart=new Date(now); wStart.setDate(now.getDate()-(now.getDay()+6)%7); wStart.setHours(0,0,0,0);
  const wFilter=t=>new Date(t.date+'T00:00:00')>=wStart;
  const todayTrades=trades.filter(t=>t.date===todayStr);
  const dailyDD=Math.max(0,-todayTrades.reduce((s,t)=>s+t.amount,0));
  // Global DD from peak
  let peak=0,run=0,curDD=0;
  st.forEach(t=>{run+=t.amount;if(run>peak)peak=run;curDD=peak-run;});
  return {
    total:trades.length,wins:wins.length,losses:losses.length,
    tGain,tLoss,net,wr,pf,avgRR,ev,
    best:sorted[0]?.amount||0, worst:sorted[sorted.length-1]?.amount||0,
    maxWin:maxW,maxLoss:maxL,curStreak:curS,curStreakType:curST,
    equity:eq,dailyDD,curDD,
    dayPnl:todayTrades.reduce((s,t)=>s+t.amount,0),
    weekPnl:trades.filter(wFilter).reduce((s,t)=>s+t.amount,0),
    monthPnl:trades.filter(mFilter).reduce((s,t)=>s+t.amount,0),
    balance:a.capital+net,
    todayTrades:todayTrades.length,
    todayLosses:todayTrades.filter(t=>t.result==='loss').length,
  };
}
function emptyStats(a){
  const cap=a?a.capital:0;
  return {total:0,wins:0,losses:0,tGain:0,tLoss:0,net:0,wr:0,pf:0,avgRR:0,ev:0,
    best:0,worst:0,maxWin:0,maxLoss:0,curStreak:0,curStreakType:'',equity:[0],
    dailyDD:0,curDD:0,dayPnl:0,weekPnl:0,monthPnl:0,balance:cap,
    todayTrades:0,todayLosses:0};
}

// ── Equity Curve ──
function drawEquityCurve(canvasId, eq, net, a){
  const canvas=document.getElementById(canvasId);
  if(!canvas||eq.length<2) return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.offsetWidth, H=140;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const minY=Math.min(...eq)-5, maxY=Math.max(...eq)+5;
  const range=maxY-minY||1;
  const pad=14, xStep=(W-pad*2)/(eq.length-1);
  const toX=i=>pad+i*xStep;
  const toY=v=>H-pad-(v-minY)/range*(H-pad*2);
  const color=net>=0?'#00E5A0':'#FF4D6D';
  // Zero line
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(pad,toY(0)); ctx.lineTo(W-pad,toY(0)); ctx.stroke();
  ctx.setLineDash([]);
  // Fill
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,net>=0?'rgba(0,229,160,.22)':'rgba(255,77,109,.22)');
  grad.addColorStop(1,net>=0?'rgba(0,229,160,.02)':'rgba(255,77,109,.02)');
  ctx.beginPath(); ctx.moveTo(toX(0),toY(eq[0]));
  eq.forEach((v,i)=>{ if(i>0) ctx.lineTo(toX(i),toY(v)); });
  ctx.lineTo(toX(eq.length-1),H); ctx.lineTo(toX(0),H); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  // Line
  ctx.beginPath(); ctx.moveTo(toX(0),toY(eq[0]));
  eq.forEach((v,i)=>{ if(i>0) ctx.lineTo(toX(i),toY(v)); });
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  // Dot
  const lx=toX(eq.length-1), ly=toY(eq[eq.length-1]);
  ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2);
  ctx.fillStyle=color; ctx.fill();
}

function selectChip(el,inputId,val){
  el.closest('.filter-row').querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(inputId).value=val;
}
function setDirection(dir){
  document.getElementById('tf-direction').value=dir;
  const buyBtn=document.getElementById('btn-buy');
  const sellBtn=document.getElementById('btn-sell');
  buyBtn.style.background=dir==='BUY'?'var(--grn)':'var(--surf2)';
  buyBtn.style.color=dir==='BUY'?'#000':'var(--grn)';
  sellBtn.style.background=dir==='SELL'?'var(--red)':'var(--surf2)';
  sellBtn.style.color=dir==='SELL'?'#fff':'var(--red)';
}
function setEmotion(which,el,val){
  const containerId='emo-'+which;
  document.getElementById(containerId).querySelectorAll('.emo-chip')
    .forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('tf-emo-'+which).value=val;
}
function triggerSSUpload(){ document.getElementById('ss-file-input').click(); }
function previewScreenshot(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const data=ev.target.result;
    document.getElementById('tf-screenshot').value=data;
    const box=document.getElementById('ss-preview-box');
    box.innerHTML=`<img src="${data}" alt="screenshot" style="width:100%;max-height:220px;object-fit:contain;border-radius:8px">
      <button class="ss-remove" onclick="removeScreenshot(event)">✕</button>`;
  };
  reader.readAsDataURL(file);
}
function removeScreenshot(e){
  e.stopPropagation();
  document.getElementById('tf-screenshot').value='';
  document.getElementById('ss-preview-box').innerHTML=`
    <span class="ss-icon">📸</span>
    <span class="ss-box-label">Toucher pour ajouter une capture</span>`;
}

async function saveTrade(editId){
  const a=acct(); if(!a) return;
  const pair=document.getElementById('tf-pair').value.trim()||'XAUUSD';
  const result=document.getElementById('tf-result').value;
  const amount=parseFloat(document.getElementById('tf-amount').value)||0;
  const finalAmount=result==='loss'?-Math.abs(amount):result==='be'?0:Math.abs(amount);
  const d=document.getElementById('tf-date').value||today();
  const dn2=()=>{
    const sd=state.settings.startDates[a.id];
    if(!sd) return 1;
    try{ return Math.floor((new Date(d+'T00:00:00')-new Date(sd+'T00:00:00'))/86400000)+1;}
    catch{return 1;}
  };
  const trade={
    id:editId||uid(), accountId:a.id, pair,
    direction:document.getElementById('tf-direction').value,
    result, amount:finalAmount,
    lotSize:parseFloat(document.getElementById('tf-lot').value)||0.01,
    risk:parseFloat(document.getElementById('tf-risk').value)||a.riskPerTrade,
    rr:parseFloat(document.getElementById('tf-rr').value)||2,
    date:d, time:document.getElementById('tf-time').value,
    session:document.getElementById('tf-session').value,
    setup:document.getElementById('tf-setup').value,
    setupGrade:document.getElementById('tf-grade').value,
    emotionBefore:document.getElementById('tf-emo-before').value,
    emotionAfter:document.getElementById('tf-emo-after').value,
    screenshotData:document.getElementById('tf-screenshot').value,
    note:document.getElementById('tf-note').value,
    dayNumber:dn2(), createdAt:new Date().toISOString(),
  };
  if(!state.trades[a.id]) state.trades[a.id]=[];
  if(editId){
    const idx=state.trades[a.id].findIndex(t=>t.id===editId);
    if(idx>-1) state.trades[a.id][idx]=trade; else state.trades[a.id].push(trade);
  } else {
    state.trades[a.id].push(trade);
  }
  await saveAll();
  closeModal('tradeModal');
  renderApp();
}

    t.pair.toLowerCase().includes(histFilters.search.toLowerCase())||
    t.note?.toLowerCase().includes(histFilters.search.toLowerCase())||
    t.setup?.toLowerCase().includes(histFilters.search.toLowerCase()));
  if(histFilters.result!=='all') trades=trades.filter(t=>t.result===histFilters.result);

  if(histFilters.pair!=='all') trades=trades.filter(t=>t.pair===histFilters.pair);

      <div class="stat-card"><div class="stat-label">SÉRIE GAINS MAX</div>

    <div class="card mb12">
      <div class="flex-between mb12">
        <div class="card-title" style="margin:0">📅 SEMAINE</div>

          <span style="font-family:'Space Mono',monospace;font-size:.7rem;color:var(--muted)">

        <tbody>${wDays.map((d,i)=>{

          return `<tr><td>${wLabels[i]} ${d.getDate()}</td><td>${tt.length}</td>

      </div>

function getMonthlyHeatmap(year,month){
  const res={};
  const dInM=new Date(year,month+1,0).getDate();
  for(let d=1;d<=dInM;d++){
    const k=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    res[k]=dayTrades(k).reduce((s,t)=>s+t.amount,0);
  }
  return res;
}

function renderHeatmapHTML(year,month,data,a){
  const firstDay=new Date(year,month,1).getDay();
  const dInM=new Date(year,month+1,0).getDate();
  const startOff=(firstDay+6)%7;
  const maxAbs=Math.max(...Object.values(data).map(Math.abs),1);
  const heads=['L','M','M','J','V','S','D'];
  let html=`<div class="cal-grid">${heads.map(h=>`<div class="cal-head">${h}</div>`).join('')}`;
  for(let i=0;i<startOff;i++) html+=`<div class="cal-day other-m"></div>`;
  for(let d=1;d<=dInM;d++){
    const k=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const v=data[k]||0, tt=dayTrades(k);
    const pct=v!==0?Math.abs(v)/maxAbs:0;
    const bg=v>0?`rgba(0,229,160,${0.1+pct*0.7})`:v<0?`rgba(255,77,109,${0.1+pct*0.7})`:'var(--surf2)';
    const isT=k===today();
    html+=`<div class="cal-day ${isT?'today-d':''}" style="background:${bg}" onclick="openDayModal('${k}','${a.id}')">
      <div class="cal-day-n">${d}</div>
      ${tt.length?`<div class="cal-pnl ${cc(v)}">${v>=0?'+':''}${v.toFixed(0)}</div>`:''}
    </div>`;
  }
  html+=`</div>`;
  return html;
}

function renderEmoCorrelation(a){
  const emoMap={};
  Object.entries(state.dailies[a.id]||{}).forEach(([d,entry])=>{
    const e=entry.mainEmotion; if(!e) return;
    if(!emoMap[e]) emoMap[e]={pnl:0,trades:0,wins:0,days:0};
    const tt=dayTrades(d,a.id);
    emoMap[e].pnl+=tt.reduce((s,t)=>s+t.amount,0);
    emoMap[e].trades+=tt.length;
    emoMap[e].wins+=tt.filter(t=>t.result==='win').length;
    emoMap[e].days++;
  });
  const keys=Object.keys(emoMap);
  if(!keys.length) return '<div class="empty">Pas encore de données</div>';
  return `<table class="sum-table"><thead><tr>
    <th>Humeur</th><th>Jours</th><th>WR</th><th>P&L Moy</th>
  </tr></thead><tbody>${keys.map(k=>{
    const v=emoMap[k];
    const wr=v.trades?Math.round(v.wins/v.trades*100):null;
    const ppd=v.days?v.pnl/v.days:0;
    return `<tr><td>${k}</td><td>${v.days}</td>
      <td class="${wr!==null?cc(wr-50):''}">${wr!==null?wr+'%':'—'}</td>
      <td class="${cc(ppd)}">${fmt(ppd,a.currency)}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function miniBarHTML(values){
  const maxA=Math.max(...values.map(Math.abs),0.01);
  return values.map(v=>`<div class="mini-bar ${v>0?'pos':v<0?'neg':'z'}"
    style="height:${v!==0?Math.max(3,Math.round(Math.abs(v)/maxA*50)):3}px"
    title="${v.toFixed(2)}"></div>`).join('');
}

// ══════════════════════════════════════════════════════════════
//  OBJECTIVES
// ══════════════════════════════════════════════════════════════
function renderObjectivesHTML(a){
  const objs=state.objectives[a.id]||[];
  if(!objs.length) return '<div class="empty">Pas d\'objectifs</div>';
  const s=getStats(a.id);
  return objs.map(obj=>{
    let cur=0,max=obj.target,label='';
    switch(obj.type){
      case 'pnl_daily':   cur=Math.max(0,s.dayPnl);   label=`${cur.toFixed(2)} / ${max} ${a.currency}`; break;
      case 'pnl_monthly': cur=Math.max(0,s.monthPnl);  label=`${cur.toFixed(2)} / ${max} ${a.currency}`; break;
      case 'winrate':     cur=s.wr;                     label=`${cur.toFixed(1)}% / ${max}%`; break;
      case 'no_loss':     cur=max-s.todayLosses;        label=`${s.todayLosses} SL aujourd'hui (max ${max})`; break;
      case 'discipline':  cur=((state.dailies[a.id]||{})[today()]||{}).discipline||0;
                          label=`Discipline ${cur}/10`; break;
      case 'funded':      cur=Math.max(0,s.net);        label=`${cur.toFixed(2)} / ${max} ${a.currency}`; break;
      default:            cur=0;
    }
    const pct=obj.type==='no_loss'?Math.max(0,1-s.todayLosses/max):cl(cur/max,0,1);
    const achieved=obj.type==='no_loss'?s.todayLosses===0:cur>=max;
    const color=achieved?'var(--grn)':pct>0.6?'var(--goldl)':'var(--red)';
    return `<div class="obj-card">
      <div class="obj-header">
        <div class="obj-title">${achieved?'🏆':''} ${obj.title}</div>
        <span class="obj-pct" style="color:${color}">${(pct*100).toFixed(0)}%</span>
      </div>
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:6px">${label}</div>
      <div class="prog-wrap h4"><div class="prog-fill h4"
        style="width:${pct*100}%;background:${color}"></div></div>
    </div>`;
  }).join('');
}

async function updateAcctField(field,val){
  const a=acct(); if(!a) return;
  a[field]=val;
  await saveAll(); renderAccountTabs();
}
async function updateStartDate(val){
  const a=acct(); if(!a) return;
  state.settings.startDates[a.id]=val;
  await saveAll(); renderApp();
}
async function deleteAccount(id){
  if(!confirm('Supprimer ce compte et tous ses trades ?')) return;
  state.accounts=state.accounts.filter(a=>a.id!==id);
  delete state.trades[id]; delete state.dailies[id]; delete state.objectives[id];
  if(activeAcctId===id) activeAcctId=state.accounts[0]?.id||'';
  await saveAll(); renderApp();
}
async function resetStats(){
  if(!confirm('Supprimer tous les trades de ce compte ?')) return;
  state.trades[activeAcctId]=[];
  state.dailies[activeAcctId]={};
  await saveAll(); renderApp();
}

async function saveNewAccount(){
  const name=document.getElementById('na-name').value.trim();
  if(!name){ alert('Indique un nom.'); return; }
  const id='acct_'+uid();
  const newAcct={
    id, name,
    capital:    parseFloat(document.getElementById('na-cap').value)||0,
    currency:   document.getElementById('na-cur').value,
    riskCapital:parseFloat(document.getElementById('na-rcap').value)||0,
    riskPerTrade:parseFloat(document.getElementById('na-risk').value)||10,
    ddDaily:    parseFloat(document.getElementById('na-ddd').value)||0,
    ddGlobal:   parseFloat(document.getElementById('na-ddg').value)||0,
    maxTrades:  parseInt(document.getElementById('na-mt').value)||3,
    maxLosses:  parseInt(document.getElementById('na-ml').value)||2,
    setupAPlus: document.getElementById('na-aplus').checked,
    propFirm:   name,
  };
  state.accounts.push(newAcct);
  state.trades[id]=[];
  state.dailies[id]={};
  state.objectives[id]=[];
  state.settings.startDates[id]=today();
  seedDefaultObjectives();
  activeAcctId=id;
  await saveAll();
  closeModal('acctModal');
  renderApp();
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.addEventListener('click', e=>{
  ['tradeModal','acctModal','detailModal','dayModal'].forEach(id=>{
    const ov=document.getElementById(id);

  });
});

// ══════════════════════════════════════════════════════════════
//  EXPORT / IMPORT
// ══════════════════════════════════════════════════════════════
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tradelog_pro_'+today()+'.json';
  a.click();
}
function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!confirm('Importer ? Les données actuelles seront remplacées.')) return;
      state=imported; ensureStructure();
      await saveAll();
      if(state.accounts.length) activeAcctId=state.accounts[0].id;
      renderApp();
    }catch{ alert('Fichier invalide.'); }
  };
  reader.readAsText(file); e.target.value='';
}
function exportCSV(){
  const a=acct(); if(!a) return;
  const trades=myTrades();
  if(!trades.length){ alert('Aucun trade à exporter.'); return; }
  const headers=['Date','Heure','Jour','Paire','Direction','Résultat','Montant',
    'Lot','Risque','RR','Session','Setup','Grade','Émotion Avant','Émotion Après','Note'];
  const rows=trades.map(t=>[
    t.date,t.time,t.dayNumber,t.pair,t.direction,t.result,t.amount,
    t.lotSize,t.risk,t.rr,t.session,t.setup,t.setupGrade||'',
    t.emotionBefore||'',t.emotionAfter||'',
    (t.note||'').replace(/,/g,';').replace(/\n/g,' ')
  ]);
  const csv=[headers,...rows].map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download='trades_'+a.name+'_'+today()+'.csv';
  link.click();
}
</script>
